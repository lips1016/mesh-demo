apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-check-task
  namespace: quay-enterprise
spec:
  params:
    - name: ORGANIZATION
      type: string
    - name: ENVIRONMENT
      type: string
  results:
    - description: Indicates if there are images to process (true/false)
      name: has-backup-image
      type: string
    - description: Cross check deployed images with images to be un-tagged (true/false)
      name: image-conflict
      type: string
  steps:
    - computeResources: {}
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              key: API_TOKEN
              name: quay-creds
        - name: API_URL
          valueFrom:
            secretKeyRef:
              key: API_URL
              name: quay-creds
        - name: ORGANIZATION
          value: $(params.ORGANIZATION)
      image: 'quay.io/paulwong6668/oc-cli:1.0.0'
      name: check-image
      script: |
        #!/bin/bash
        # 注意：刻意不使用 set -e，因為 grep 找不到時會回傳非 0，會誤中斷

        echo "Target Quay Organization is: $(params.ORGANIZATION)"
        echo "Target Environment is: $(params.ENVIRONMENT)"

        LOGS_VOLUME="/workspace/logs-volume"
        NEXT_PAGE=""

        DEPLOYED_IMAGES_FILE="$LOGS_VOLUME/deployed-images-list"
        DEPLOYED_IMAGES_TMP_FILE="$LOGS_VOLUME/deployed-images-tmp"
        BACKUP_LIST="$LOGS_VOLUME/backup-list"

        # ★ 修正：開頭先清空所有暫存檔，避免跨次執行累積舊資料
        > "$DEPLOYED_IMAGES_FILE"
        > "$DEPLOYED_IMAGES_TMP_FILE"
        > "$BACKUP_LIST"

        # ============================================
        # Step 1: 抓取環境中「已部署」的 images
        # ============================================
        echo "Fetching deployed images from the environment..."

        # ★ 修正：用 jsonpath 取所有 namespace 名稱，避免表頭與引號問題
        ns=$(oc get ns -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -- "$(params.ENVIRONMENT)" || true)
        echo "Namespaces matched: $ns"

        for namespace in $ns; do
          pods=$(oc get pods --namespace="$namespace" --field-selector=status.phase=Running --output=jsonpath='{.items[*].metadata.name}')
          for pod in $pods; do
            # ★ 修正：用 range 逐行輸出「每個 container」的 image，不再被 awk '{print $1}' 截斷
            images=$(oc get pod "$pod" --namespace="$namespace" \
              --output=jsonpath='{range .spec.containers[*]}{.image}{"\n"}{end}' \
              | grep "/$(params.ORGANIZATION)/" || true)
            echo "$images" >> "$DEPLOYED_IMAGES_TMP_FILE"
          done
        done

        grep -v '^[[:space:]]*$\|HELLO' "$DEPLOYED_IMAGES_TMP_FILE" | uniq >> "$DEPLOYED_IMAGES_FILE" || true

        echo "=== Deployed images (will be preserved) ==="
        cat "$DEPLOYED_IMAGES_FILE"
        echo "Deployed images fetched and saved to $DEPLOYED_IMAGES_FILE."
        sleep 2

        # ============================================
        # Function: 列出某 repo 的所有 tags（含翻頁，排除 rel）
        # ============================================
        fetch_tags() {
          local repo=$1
          local page=1
          while true; do
            # ★ 修正：limit 用 100（Quay 上限），並用 page 翻頁
            local tags_url="${API_URL}/repository/$(params.ORGANIZATION)/${repo}/tag/?limit=100&page=${page}"
            local tags_response=$(curl -k -s -H "Authorization: Bearer $TOKEN" "$tags_url")

            echo "Tags for $repo (page $page):"
            echo "$tags_response" | jq -r '.tags[] | select(.name != "latest") | "\(.name) \(.last_modified)"' | grep -v rel

            # ★ 修正：讀 has_additional 決定是否還有下一頁
            [ "$(echo "$tags_response" | jq -r '.has_additional // false')" != "true" ] && break
            page=$((page + 1))
          done
          echo "========================================================================="
        }

        # ============================================
        # Function: 產生待刪除 tag 清單（寫入 backup-list）
        # ============================================
        delete_tags() {
          local repo=$1
          local tags=("$@")
          for tag in "${tags[@]:1}"; do
            # 已部署的 image 一律跳過
            if grep -q "$repo:$tag" "$DEPLOYED_IMAGES_FILE"; then
              echo "Skipping deletion of deployed image: $repo:$tag"
              continue
            fi

            echo "Tag can be deleted: $tag from repository: $repo"
            echo "$(params.ORGANIZATION)/$repo:$tag" >> "$BACKUP_LIST"
            sleep 1
          done
        }

        # ============================================
        # Function: 只保留最新 20 個 tag（含翻頁）
        # ============================================
        manage_tags() {
          local repo=$1
          local page=1
          local all_tags=""

          # ★ 修正：翻頁抓取全部 tags
          while true; do
            local tags_url="${API_URL}/repository/$(params.ORGANIZATION)/${repo}/tag/?limit=100&page=${page}"
            local tags_response=$(curl -k -s -H "Authorization: Bearer $TOKEN" "$tags_url")

            all_tags+=$(echo "$tags_response" | jq -r '.tags[] | select(.name != "latest") | "\(.name) \(.last_modified)"')
            all_tags+=$'\n'

            [ "$(echo "$tags_response" | jq -r '.has_additional // false')" != "true" ] && break
            page=$((page + 1))
          done

          # ★ 修正：tail -n +21（保留前 20 個，從第 21 個開始刪）
          local tags_to_delete
          tags_to_delete=$(echo "$all_tags" | grep -v '^[[:space:]]*$' | tail -n +21 | awk '{print $1}' | grep -v rel)

          if [ -n "$tags_to_delete" ]; then
            delete_tags "$repo" $tags_to_delete
            sleep 2
          fi
        }

        # ============================================
        # 主迴圈：翻頁掃描所有 repositories
        # ============================================
        while true; do
          if [ -z "$NEXT_PAGE" ]; then
            RESPONSE=$(curl -k -s -H "Authorization: Bearer $TOKEN" "${API_URL}/repository?namespace=$(params.ORGANIZATION)")
          else
            RESPONSE=$(curl -k -s -H "Authorization: Bearer $TOKEN" "${API_URL}/repository?namespace=$(params.ORGANIZATION)&next_page=${NEXT_PAGE}")
          fi

          if ! echo "$RESPONSE" | jq empty 2>/dev/null; then
            echo "Error: Invalid JSON response from API" >&2
            echo "Response: $RESPONSE" >&2
            exit 1
          fi

          echo "$RESPONSE" | jq -r '.repositories[].name' | while read -r repo; do
            echo "  "
            echo "========================================================================="
            echo "Repository: $repo"
            fetch_tags "$repo"
            manage_tags "$repo"
          done

          NEXT_PAGE=$(echo "$RESPONSE" | jq -r '.next_page // empty')
          [ -z "$NEXT_PAGE" ] && break
        done

        # ============================================
        # 輸出結果
        # ============================================
        if [ ! -s "$BACKUP_LIST" ]; then
          echo "No images to delete for organization $(params.ORGANIZATION)"
          echo -n "false" > "$(results.has-backup-image.path)"
        else
          echo "Pipeline can proceed safely."
          echo -n "true" > "$(results.has-backup-image.path)"
          echo "The following images should be backed up before un-tag:"
          cat "$BACKUP_LIST"
        fi
        echo "has-backup-image = $(cat "$(results.has-backup-image.path)")"

    - computeResources: {}
      image: 'quay.io/paulwong6668/oc-cli:1.0.0'
      name: cross-check-images
      script: |
        #!/bin/bash

        deployed_images=$(cat "/workspace/logs-volume/deployed-images-list" 2>/dev/null || true)
        backup_images=$(cat "/workspace/logs-volume/backup-list" 2>/dev/null || true)

        conflict_found=false

        for image in $deployed_images; do
          # ★ 修正：deployed 是完整路徑 registry/org/repo:tag，
          #          backup 是 org/repo:tag，這裡統一成 org/repo:tag 再比對
          short="$(params.ORGANIZATION)/${image#*$(params.ORGANIZATION)/}"

          # ★ 修正：用 -Fx 精確整行比對，避免 regex 特殊字元與前綴誤判
          if echo "$backup_images" | grep -Fxq "$short"; then
            echo "Conflict: Image $short appears in the backup list. Please review."
            conflict_found=true
          fi
        done

        if [ "$conflict_found" = "true" ]; then
          echo -n "false" > "$(results.image-conflict.path)"
        else
          echo "Cross-check complete: No conflicts found between deployed-images-list and backup-list."
          echo -n "true" > "$(results.image-conflict.path)"
        fi
        echo "image-conflict = $(cat "$(results.image-conflict.path)")"
  workspaces:
    - description: Storage for log files
      name: logs-volume
