---
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo-1
  labels:
    app: mesh-demo
    app.kubernetes.io/part-of: mesh-demo

---
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo-2
  labels:
    app: mesh-demo
    app.kubernetes.io/part-of: mesh-demo

---
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo-3
  labels:
    app: mesh-demo
    app.kubernetes.io/part-of: mesh-demo

---
apiVersion: v1
