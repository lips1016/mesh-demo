apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo-5
  labels:
    app: mesh-demo
    app.kubernetes.io/part-of: mesh-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: mesh-demo-1
  labels:
    app: app1
    mesh-demo: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        image: harbor.luban.paulhome.local/mesh-demo/app1:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: "App 1"
        - name: APP_NAMESPACE
          value: "mesh-demo-1"
        - name: APP_PORT
          value: "8080"
        - name: OTHER_APPS
          value: |
            [{"name": "app2", "namespace": "mesh-demo-2", "host": "app2.mesh-demo-2.svc.cluster.local"}, {"name": "app3", "namespace": "mesh-demo-3", "host": "app3.mesh-demo-3.svc.cluster.local"}, {"name": "app4", "namespace": "mesh-demo-4", "host": "app4.mesh-demo-4.svc.cluster.local"}, {"name": "app5", "namespace": "mesh-demo-5", "host": "app5.mesh-demo-5.svc.cluster.local"}]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: mesh-demo-1
  labels:
    app: app1
spec:
  selector:
    app: app1
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1-route
  namespace: mesh-demo-1
spec:
  hostnames:
  - "app1.luban.paulhome.local"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: luban-gateway
    namespace: gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: app1
      port: 80

